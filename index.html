<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOTICKET - Plataforma de Eventos</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col font-sans bg-[#0f172a] text-slate-200 select-none transition-colors duration-300">

  <!-- ================= CABEÇALHO ================= -->
  <header class="bg-slate-900/90 backdrop-blur-md text-white p-4 flex flex-wrap md:flex-nowrap justify-between items-center gap-4 px-8 border-b border-slate-800 sticky top-0 z-40 transition-colors duration-300">
    
    <div class="text-2xl font-black tracking-tighter bg-gradient-to-r from-violet-500 to-pink-500 bg-clip-text text-transparent italic flex-shrink-0">
      GO<span class="logo-ticket text-white">TICKET</span>
    </div>
    
    <!-- Barra de Pesquisa Central + Dropdown -->
    <div id="search-wrapper" class="order-3 md:order-2 w-full md:max-w-md lg:max-w-lg mx-auto relative">
      <div class="relative flex items-center group">
        <i data-lucide="search" class="absolute left-4 text-slate-500 group-focus-within:text-violet-400 transition-colors w-4 h-4"></i>
        <input 
          id="search-input"
          type="text" 
          autocomplete="off"
          placeholder="Pesquise por evento ou categoria..." 
          class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl py-2.5 pl-11 pr-10 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-violet-500/50 outline-none transition-all"
        />
        <button id="btn-clear-search" class="absolute right-3 text-slate-500 hover:text-white hidden">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="search-results-dropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-900/95 backdrop-blur-2xl border border-slate-800 rounded-2xl shadow-[0_25px_60px_rgba(0,0,0,0.85)] overflow-hidden z-50 max-h-96 overflow-y-auto no-scrollbar"></div>
    </div>

    <!-- Ações da Direita -->
    <div class="order-2 md:order-3 flex items-center gap-3 sm:gap-4 flex-shrink-0">
      <button id="btn-theme-toggle" title="Alternar Tema" class="bg-slate-800 p-2.5 rounded-full hover:bg-violet-500/20 transition-all flex items-center justify-center">
        <i id="theme-icon" data-lucide="moon" class="w-5 h-5 text-violet-400"></i>
      </button>

      <button id="btn-open-cart" class="relative bg-slate-800 p-2.5 rounded-full hover:bg-violet-500/20 transition-all flex items-center justify-center">
        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        <span id="cart-counter" class="absolute -top-1 -right-1 bg-violet-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-lg hidden">0</span>
      </button>

      <div id="btn-open-auth" class="flex items-center gap-2 cursor-pointer group">
        <div class="bg-slate-800 p-2 rounded-full group-hover:bg-violet-500/20 transition-all">
          <i data-lucide="user" class="w-5 h-5"></i>
        </div>
        <span class="text-sm font-bold hidden sm:block">Entrar / Registar</span>
      </div>
    </div>
  </header>

  <!-- ================= CORPO DA PÁGINA ================= -->
  <main class="flex-1 py-8 px-6 lg:px-12 flex flex-col w-full max-w-[1700px] mx-auto overflow-hidden">
    
    <!-- BANNER DE DESTAQUE NO TOPO -->
    <section class="mb-12 relative w-full overflow-hidden group">
      <button id="hero-prev" class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 z-30 bg-slate-950/70 hover:bg-violet-600 text-white p-3.5 rounded-full backdrop-blur-md border border-white/15 transition-all shadow-2xl opacity-0 group-hover:opacity-100">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>

      <div id="hero-banner-container" class="flex items-center justify-center gap-4 px-2 transition-all duration-500"></div>

      <button id="hero-next" class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 z-30 bg-slate-950/70 hover:bg-violet-600 text-white p-3.5 rounded-full backdrop-blur-md border border-white/15 transition-all shadow-2xl opacity-0 group-hover:opacity-100">
        <i data-lucide="chevron-right" class="w-6 h-6"></i>
      </button>
    </section>

    <!-- BOTÃO INTERATIVO DE CATEGORIAS (CANTO ESQUERDO ACIMA DOS CARROSSÉIS) -->
    <div class="relative mb-10 w-fit z-30" id="category-dropdown-wrapper">
      <button id="btn-toggle-categories" class="bg-slate-900 border border-slate-800 hover:border-violet-500/50 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-wider flex items-center gap-3 shadow-xl transition-all">
        <i data-lucide="grid" class="w-4 h-4 text-violet-500"></i>
        <span id="category-btn-label">Filtrar por Categoria</span>
        <i data-lucide="chevron-down" id="category-arrow" class="w-4 h-4 transition-transform duration-300"></i>
      </button>

      <!-- MENU SUSPENSO INTERATIVO DE CATEGORIAS -->
      <div id="category-menu" class="hidden absolute left-0 top-full mt-3 w-64 bg-slate-900/95 backdrop-blur-2xl border border-slate-800 rounded-2xl shadow-2xl p-3 z-40 max-h-72 overflow-y-auto no-scrollbar">
        <button onclick="selectCategory(null)" class="w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold uppercase text-violet-400 hover:bg-slate-800 transition-colors mb-1">
          ✨ Todas as Categorias
        </button>
        <div id="category-items-container" class="flex flex-col gap-1"></div>
      </div>
    </div>

    <!-- CARROSSÉIS AMPLIADOS -->
    <div class="space-y-16 w-full">
      
      <!-- SEÇÃO: EM ALTA NA SEMANA -->
      <section>
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl sm:text-3xl font-black text-white flex items-center gap-3 italic tracking-tight uppercase">
            <i data-lucide="flame" class="text-pink-500 fill-pink-500 w-6 h-6"></i>
            Em Alta na Semana
          </h2>
          <div class="flex gap-2">
            <button id="btn-prev-secondary" class="nav-arrow-btn bg-slate-800/80 p-2.5 rounded-xl hover:bg-slate-700 transition-all disabled:opacity-20">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button id="btn-next-secondary" class="nav-arrow-btn bg-slate-800/80 p-2.5 rounded-xl hover:bg-slate-700 transition-all disabled:opacity-20">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div class="relative">
          <div id="secondary-events-carousel" class="flex gap-6 overflow-x-auto scroll-smooth no-scrollbar pb-4 snap-x snap-mandatory"></div>
        </div>
      </section>

      <!-- SEÇÃO: EVENTOS PRINCIPAIS -->
      <section>
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl sm:text-3xl font-black text-white flex items-center gap-3 italic tracking-tight uppercase">
            <i data-lucide="zap" class="text-violet-500 fill-violet-500 w-6 h-6"></i>
            Eventos Principais
          </h2>
          <div class="flex gap-2">
            <button id="btn-prev-main" class="nav-arrow-btn bg-slate-800/80 p-2.5 rounded-xl hover:bg-slate-700 transition-all disabled:opacity-20">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button id="btn-next-main" class="nav-arrow-btn bg-slate-800/80 p-2.5 rounded-xl hover:bg-slate-700 transition-all disabled:opacity-20">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div class="relative">
          <div id="events-carousel" class="flex gap-6 overflow-x-auto scroll-smooth no-scrollbar pb-8 snap-x snap-mandatory"></div>
        </div>
      </section>

      <!-- SEÇÃO: MAIS PROCURADOS (AGORA ABAIXO DOS PRINCIPAIS) -->
      <section>
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl sm:text-3xl font-black text-white flex items-center gap-3 italic tracking-tight uppercase">
            <i data-lucide="star" class="text-amber-500 fill-amber-500 w-6 h-6"></i>
            Mais Procurados
          </h2>
          <div class="flex gap-2">
            <button id="btn-prev-tertiary" class="nav-arrow-btn bg-slate-800/80 p-2.5 rounded-xl hover:bg-slate-700 transition-all disabled:opacity-20">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button id="btn-next-tertiary" class="nav-arrow-btn bg-slate-800/80 p-2.5 rounded-xl hover:bg-slate-700 transition-all disabled:opacity-20">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div class="relative">
          <div id="tertiary-events-carousel" class="flex gap-6 overflow-x-auto scroll-smooth no-scrollbar pb-4 snap-x snap-mandatory"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- ================= MODAL DE ANÚNCIO ================= -->
  <div id="modal-overlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-3xl hidden items-center justify-center z-50 p-4 sm:p-6">
    <div class="modal-box bg-slate-900 rounded-[2.5rem] sm:rounded-[3.5rem] w-full max-w-xl p-0 relative shadow-[0_0_100px_rgba(0,0,0,0.5)] border border-slate-800/80 overflow-hidden max-h-[95vh] overflow-y-auto no-scrollbar">
      <button id="btn-close-modal" class="absolute top-6 right-6 sm:top-8 sm:right-8 text-slate-400 hover:text-white p-3 z-20 bg-slate-950/50 rounded-full transition-all border border-white/5">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ================= DRAWER DO CARRINHO ================= -->
  <div id="cart-drawer-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 transition-opacity">
    <div id="cart-drawer" class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-slate-900 border-l border-slate-800 p-6 sm:p-8 flex flex-col shadow-2xl transform translate-x-full transition-transform duration-300">
      <div class="flex items-center justify-between pb-6 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <i data-lucide="shopping-cart" class="text-violet-500 w-6 h-6"></i>
          <h2 class="text-xl font-black text-white italic uppercase tracking-wider">Seu Carrinho</h2>
        </div>
        <button id="btn-close-cart" class="text-slate-400 hover:text-white p-2 rounded-full bg-slate-950/50 border border-white/5">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="cart-items-container" class="flex-1 overflow-y-auto py-6 space-y-4 no-scrollbar"></div>

      <div class="border-t border-slate-800 pt-6 space-y-4">
        <div class="flex justify-between items-center">
          <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">Total Geral:</span>
          <span id="cart-total" class="text-2xl font-black text-white">R$ 0,00</span>
        </div>
        <button onclick="checkoutCart()" class="w-full bg-violet-600 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-[0.25em] hover:bg-violet-500 transition-all shadow-xl active:scale-[0.98]">
          Finalizar Reserva
        </button>
      </div>
    </div>
  </div>

  <footer class="py-16 bg-slate-950 flex flex-col items-center justify-center border-t border-slate-900 mt-auto transition-colors duration-300">
    <div class="text-3xl font-black bg-gradient-to-r from-violet-500 via-pink-500 to-violet-500 bg-clip-text text-transparent opacity-40 italic tracking-tighter mb-4 uppercase">
      GOTICKET
    </div>
    <p class="text-[9px] text-slate-600 font-bold uppercase tracking-[0.6em]">© 2026 Powered by Modern Experience Design</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
